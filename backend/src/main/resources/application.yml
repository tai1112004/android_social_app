spring:
  application:
    name: social-messaging-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/social_app}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:01112004}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  upload-dir: ${UPLOAD_DIR:uploads}

server:
  port: 8082

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
  expiration:
    access: 900000        # 15 minutes in milliseconds
    refresh: 604800000    # 7 days in milliseconds

logging:
  level:
    root: INFO
    com.yourapp: DEBUG
